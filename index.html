<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>T-30Y:16N</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
      background-size: 400% 400%;
      animation: bgMove 12s ease infinite;
      font-family: "Poppins", sans-serif;
      padding: 24px 16px 32px;
      overflow-y: auto;
    }

    @keyframes bgMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── STARTUP POPUP ── */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(74, 28, 47, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .popup-box {
      width: 100%;
      max-width: 360px;
      padding: 36px 28px 32px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(255,255,255,0.45);
      position: relative;
      animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.75); }
      to   { opacity: 1; transform: scale(1); }
    }

    .popup-box::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      background: linear-gradient(120deg, #ff4d6d, #ff9a9e, #fbc2eb);
      z-index: -1;
      filter: blur(20px);
      opacity: 0.7;
    }

    .popup-icon {
      font-size: 48px;
      margin-bottom: 12px;
      animation: heartbeat 1.8s infinite;
    }

    .popup-box h3 {
      font-family: "Playfair Display", serif;
      font-size: clamp(18px, 5vw, 22px);
      color: #4a1c2f;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .popup-box h3 span {
      display: block;
      font-size: clamp(13px, 3.5vw, 15px);
      font-family: "Poppins", sans-serif;
      font-weight: 400;
      color: #a0556e;
      margin-top: 6px;
    }

    .popup-btn {
      padding: 14px 36px;
      border-radius: 40px;
      border: none;
      font-size: clamp(14px, 4vw, 16px);
      font-weight: 500;
      cursor: pointer;
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: #fff;
      box-shadow: 0 12px 30px rgba(255,77,109,0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-family: "Poppins", sans-serif;
      touch-action: manipulation;
      min-height: 48px;
    }

    .popup-btn:active { transform: scale(0.95); }

    /* ── MAIN CARD ── */
    .card {
      width: 100%;
      max-width: 420px;
      padding: clamp(28px, 7vw, 40px) clamp(20px, 6vw, 30px) clamp(32px, 8vw, 45px);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(255,255,255,0.4);
      position: relative;
      animation: cardIn 1.1s ease;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      background: linear-gradient(120deg, #ff4d6d, #ff9a9e, #fbc2eb);
      z-index: -1;
      filter: blur(20px);
      opacity: 0.7;
    }

    .emoji {
      font-size: clamp(52px, 15vw, 68px);
      margin-bottom: 12px;
      animation: heartbeat 1.8s infinite;
      display: block;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      25%      { transform: scale(1.08); }
      50%      { transform: scale(1); }
      75%      { transform: scale(1.12); }
    }

    h2 {
      font-family: "Playfair Display", serif;
      font-size: clamp(22px, 6.5vw, 28px);
      color: #4a1c2f;
      margin-bottom: 32px;
      line-height: 1.35;
    }

    /* ── BUTTONS — stacked on mobile, side-by-side on wider screens ── */
    .buttons {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      min-height: 56px;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 40px;
      border: none;
      font-size: clamp(14px, 4vw, 16px);
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      font-family: "Poppins", sans-serif;
      touch-action: manipulation;
      min-height: 52px;
      min-width: 120px;
      position: static; /* override absolute for mobile */
      white-space: nowrap;
    }

    #yes {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: #fff;
      box-shadow: 0 15px 35px rgba(255,77,109,0.55);
    }

    #yes:active {
      transform: scale(0.94);
      box-shadow: 0 8px 20px rgba(255,77,109,0.4);
    }

    #no {
      background: rgba(255,255,255,0.9);
      color: #777;
      /* position becomes absolute only on desktop for the runaway effect */
    }

    #no:active { transform: scale(0.94); }

    .hint {
      margin-top: 24px;
      font-size: clamp(11px, 3vw, 13px);
      color: #6b6b6b;
      font-style: italic;
    }

    /* ── FOOTER ── */
    .footer {
      font-family: "Poppins", sans-serif;
      font-size: clamp(12px, 3.2vw, 13px);
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 6px rgba(0,0,0,0.2);
      letter-spacing: 0.3px;
      text-align: center;
      animation: cardIn 1.4s ease;
      padding: 0 12px;
    }

    .footer a {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1.5px dashed rgba(255,255,255,0.7);
      padding-bottom: 1px;
      transition: color 0.2s ease;
    }

    .footer a:active { color: #ffb3c1; }

    /* ── FLOATING HEARTS ── */
    .heart {
      position: fixed;
      bottom: -20px;
      animation: floatUp linear forwards;
      pointer-events: none;
      filter: blur(0.3px);
      z-index: 0;
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to   { transform: translateY(-110vh) scale(1.8); opacity: 0; }
    }

    /* ── DESKTOP: restore old absolute button layout for runaway effect ── */
    @media (min-width: 480px) {
      .buttons {
        height: 78px;
        display: block;
      }

      .btn {
        position: absolute;
      }

      #yes { left: 12%; top: 0; }
      #no  { left: 55%; top: 0; }

      #yes:hover {
        transform: translateY(-3px);
        box-shadow: 0 20px 40px rgba(255,77,109,0.7);
      }

      .footer a:hover {
        color: #ff4d6d;
        border-bottom-color: #ff4d6d;
        text-shadow: 0 0 10px rgba(255,77,109,0.5);
      }
    }
  </style>
</head>

<body>

  <!-- STARTUP POPUP -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-icon">💻✨</div>
      <h3>
        Psst, a little secret...
        <span>Cool people open this link on a laptop 😏</span>
      </h3>
      <button class="popup-btn" id="popupCloseBtn">okay fine 💅</button>
    </div>
  </div>

  <!-- MAIN CARD -->
  <div class="card">
    <span class="emoji">🐱❤️</span>
    <h2>guyz<br>wanna know abt<br>T-30Y:16N?</h2>

    <div class="buttons">
      <button class="btn" id="yes">Yes 💖</button>
      <button class="btn" id="no">No 🙈</button>
    </div>

    <div class="hint">Some EVENTS don't allow "no" 💅</div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    only baddies here &nbsp;—&nbsp;
    <a href="https://www.instagram.com/thatbtguy.16" target="_blank" rel="noopener">insta</a>
  </div>

  <audio id="hoverSound" src="https://assets.mixkit.co/sfx/preview/mixkit-cartoon-voice-laugh-343.mp3" preload="auto"></audio>
  <audio id="yesSound"   src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3" preload="auto"></audio>

  <script>
    /* ── Popup close ── */
    document.getElementById("popupCloseBtn").addEventListener("click", () => {
      const overlay = document.getElementById("popupOverlay");
      overlay.style.transition = "opacity 0.35s ease";
      overlay.style.opacity = "0";
      setTimeout(() => overlay.remove(), 350);
    });

    /* ── Elements ── */
    const noBtn      = document.getElementById("no");
    const yesBtn     = document.getElementById("yes");
    const card       = document.querySelector(".card");
    const hoverSound = document.getElementById("hoverSound");
    const yesSound   = document.getElementById("yesSound");

    const isMobile = () => window.innerWidth < 480;

    /* ── No button — runaway on desktop, teleport on mobile tap ── */
    function runAway() {
      hoverSound.currentTime = 0;
      hoverSound.play().catch(() => {});

      if (isMobile()) {
        /* On mobile: move to a random spot within the card */
        const cardRect = card.getBoundingClientRect();
        const btnW = noBtn.offsetWidth;
        const btnH = noBtn.offsetHeight;

        const maxX = cardRect.width  - btnW  - 8;
        const maxY = cardRect.height - btnH  - 8;

        noBtn.style.position = "absolute";
        noBtn.style.left = Math.max(4, Math.random() * maxX) + "px";
        noBtn.style.top  = Math.max(4, Math.random() * maxY) + "px";
      } else {
        /* Desktop: same absolute movement within card */
        const cardRect = card.getBoundingClientRect();
        const btnW = noBtn.offsetWidth;
        const btnH = noBtn.offsetHeight;

        const maxX = cardRect.width  - btnW  - 10;
        const maxY = cardRect.height - btnH  - 10;

        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top  = Math.random() * maxY + "px";
      }
    }

    noBtn.addEventListener("mouseenter", runAway);   /* desktop hover */
    noBtn.addEventListener("touchstart", (e) => {    /* mobile tap */
      e.preventDefault();
      runAway();
    }, { passive: false });

    /* ── Yes button ── */
    function handleYes() {
      yesSound.play().catch(() => {});
      confetti({ particleCount: 260, spread: 120, origin: { y: 0.65 } });
      setTimeout(() => {
        window.location.href = "https://t30y16n.vercel.app/";
      }, 1000);
    }

    yesBtn.addEventListener("click", handleYes);

    /* ── Floating hearts ── */
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.5 ? "❤️" : "💗";
      heart.style.left              = Math.random() * 100 + "vw";
      heart.style.fontSize          = Math.random() * 18 + 12 + "px";
      heart.style.animationDuration = Math.random() * 3 + 4 + "s";
      heart.style.opacity           = Math.random() * 0.5 + 0.4;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
